[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comfy-draftsman"
dynamic = ["version"]
description = "Local-first MCP server that drafts, organizes, validates, and runs ComfyUI workflows - saved as clean, labeled, annotated UI-format graphs anyone can read."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "EnragedAntelope" }]
keywords = ["comfyui", "mcp", "model-context-protocol", "workflow", "stable-diffusion", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Upper bound is load-bearing, not caution: mcp 2.0.0 removed
  # `mcp.server.fastmcp`, which server.py imports at module scope, so an
  # unbounded pin means a fresh install resolves 2.x and cannot start at all.
  # Verified: 1.29.0 imports fine, 2.0.0 raises ModuleNotFoundError.
  "mcp>=1.10,<2",
  "httpx>=0.27",
  "websockets>=13.0",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/EnragedAntelope/comfy-draftsman"
Issues = "https://github.com/EnragedAntelope/comfy-draftsman/issues"
Documentation = "https://github.com/EnragedAntelope/comfy-draftsman/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/EnragedAntelope/comfy-draftsman/blob/main/CHANGELOG.md"

[project.scripts]
comfy-draftsman = "comfy_draftsman.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

# Single source of truth for the version: comfy_draftsman.__version__.
# Keeps pyproject and the package from drifting (they did: 0.4.2 vs 0.5.0).
[tool.hatch.version]
path = "src/comfy_draftsman/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/comfy_draftsman"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

# A pragmatic baseline: check the package (not tests/fixtures) in default mode.
# Not strict - the graph model is intentionally Any-heavy where it mirrors
# ComfyUI's loosely-typed JSON - but it catches None-narrowing and signature
# mismatches the test suite can't.
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running ComfyUI test instance (COMFYUI_TEST_URL)",
]
addopts = "-m 'not integration'"
