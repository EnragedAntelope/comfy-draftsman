family: minimax_h3_image
display_name: MiniMax H3 Image
# MiniMax H3 Image: 33B single-stream DiT (H3 without the audio layers) for
# text-to-image and editing with up to 16 reference images. "minimax_h3_image"
# is longer than the video family's "minimax_h3", so these files detect here.
detect:
  checkpoint_patterns: ["minimax_h3_image", "minimax-h3-image"]
loader: unet_clip_vae
components:
  text_encoders: ["qwen3vl_32b_minimax_h3 (int8_convrot or nvfp4_awq; CLIPLoader, type=minimax) - the same encoder as H3 video"]
  vae: "minimax_h3_image_vae_fp16.safetensors (image VAE, NOT the H3 video/audio VAEs)"
  prompt_upsampler: "qwen3.5_9b_w4a8_gptq (CLIPLoader type=minimax into TextGenerateV2)"
sampling:
  cfg: {min: 1, max: 1, default: 1}
  steps: {min: 6, max: 6, default: 6}
  # lcm = SamplerLCM s_noise 1.1 -> s_noise_end 0.9 via SamplerCustomAdvanced (tested
  # locally); euler is the Comfy template default
  samplers: [lcm, euler_ancestral, euler]
  schedulers: [simple]
multiple_of: 32
# the 16 px VAE patch grain scores 10-23 on the sweep banding metric with no
# stripes visible even at 6x contrast (local renders 2026-11-11)
banding:
  grain_period_px: 16
  grain_max: 25
native_resolution:
  max_mp: 40
  note: >-
    Text-to-image works from about 4 MP to 40 MP; start at 20 MP: 4480x4480
    (1:1), 5152x3872 (4:3), 5472x3648 (3:2), 5952x3360 (16:9), 6848x2944
    (21:9). 16 MP can show artifacts that 20 MP does not, and 20-40 MP
    renders look better. Generate at the final size directly - no upscaler
    pass. The Comfy template defaults to 3104x3104.
notes:
  loaders: >-
    UNETLoader (minimax_h3_image_pruned_{bf16|int8_convrot|w4a8}) + CLIPLoader
    qwen3vl_32b_minimax_h3 type=minimax + VAELoader minimax_h3_image_vae_fp16.
    MiniMaxH3ImageConditioning builds the conditioning and size; the negative
    is ConditioningZeroOut. Decode with plain VAEDecode.
  sampling: >-
    Distilled to exactly 6 steps with no CFG (CFG 1, simple scheduler); the
    reference servers reject any other step count or guidance, and negative
    prompts are not supported. Tested at 16 MP with 1:1 crops: SamplerLCM with
    s_noise 1.1 -> s_noise_end 0.9 (SamplerCustomAdvanced) gives the most
    natural skin and fabric; SamplerEulerAncestral eta 1, s_noise 0.9 is a close
    second; plain euler (the template default) over-sharpens skin into a
    blotchy texture. LCM 1.0/1.0 and 1.2/0.8 were no better.
  resolution: >-
    Text-to-image output: prefer 20 MP over 16 MP (user renders: 16 MP shows
    artifacts 20 MP does not; 20-40 MP look much better). 20 MP is about 30%
    slower than 16 MP. Core ResolutionSelector caps megapixels at 16: for 20 MP
    run it at 1 MP and scale each side with ComfyMathExpression
    round(a * mp ** 0.5 / 32) * 32.
  edit_resolution: >-
    Edits are sized separately: MiniMaxH3ImageConditioning's tooltip says it
    is tuned for a 2048x2048 area, and width/height 0 takes image_1's size
    after its reference scaling. The text-to-image 20 MP advice does not
    carry over to edit references.
  edit_identity: >-
    Reference-identity edits (new angles of one person) follow angles and
    scenes strongly but identity drifts: ArcFace likeness 0.57-0.63 vs FIBO
    2.0 Edit Turbo 0.80 on the same subjects and prompts. A face crop as
    second reference (0.63), 20/24 MP and the recon VAE (0.59) helped little.
    Prefer FIBO 2.0 Edit for likeness. Citing <Picture 1> changed nothing vs
    "the reference image" for one reference.
  loras: >-
    Photo LoRAs trained near 1.3 MP hurt at 16 MP in testing (0.8 over-sharpened
    skin and added stray limbs; 0.4 changed the composition without a clear
    gain). H3-Image is already strongly photographic - keep LoRAs optional and
    start at 0.3-0.5.
  prompting: >-
    Expects a long, detailed English description of the whole image. The
    template runs a short prompt through qwen3.5_9b (TextGenerateV2) to expand
    it and pick the canvas; MiniMax also ships MiniMax-H3-Image-PE for this.
    Edit references are cited in order as <Picture 1>, <Picture 2>, ...
  limits: >-
    License requires MiniMax's written permission above 1M USD annual revenue
    or for hosted services.
research: >-
  Floor written 2026-11-11 from https://huggingface.co/MiniMaxAI/MiniMax-H3-Image
  (model card: steps, guidance, sizes) and Comfy-Org/workflow_templates
  image_minimax_h3_image_t2i / _edit. Sampler, resolution, LoRA and banding
  notes from local A/B renders 2026-11-11 (32 GB card, full int8 DiT, 16 MP,
  6 steps, 1:1 crops); the LCM 1.1 -> 0.9 and euler_ancestral s_noise 0.9
  starting points came from community H3-Image workflows. 2026-11-24: 20 MP
  default from user render reports; edit identity from local A/B with ArcFace
  likeness scoring.
