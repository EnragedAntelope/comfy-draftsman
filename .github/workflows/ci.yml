name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # 15-min ceiling: the full suite runs in <60s on every matrix cell
    # we've measured. Capping the job also surfaces GitHub-hosted
    # runner-acquisition failures ("not acquired even after multiple
    # attempts") as a fast, clear failure rather than a 15-minute hang
    # that burns CI minutes before the runner ever starts.
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # --frozen: fail if the committed uv.lock is stale rather than silently
      # resolving something else than what a user installing from it would get
      - name: Install
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy src
      - name: Test
        run: uv run pytest

  # The only job that installs from the INDEX instead of uv.lock, so it is the
  # only one that sees a fresh user's dependency resolution. It proves two things
  # no test can: that the non-Python data (knowledge/families/*.yaml) lands in the
  # wheel, and that the declared pins actually import - an unbounded pin that a
  # new major version breaks is invisible to every locked job.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: uv build
      - name: The wheel imports and ships its data, resolved against the index
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" python -c "
          # server first: unlike every other job, this resolves the dependency
          # pins AGAINST THE INDEX rather than uv.lock, so it is the only check
          # that sees what a new user actually gets. Importing just the knowledge
          # package missed mcp 2.0.0 dropping mcp.server.fastmcp, and 0.15.0
          # shipped unstartable.
          import comfy_draftsman.server  # noqa: F401
          import comfy_draftsman, comfy_draftsman.knowledge as k
          families = k.list_families()
          print(comfy_draftsman.__version__, families)
          assert 'flux' in families and 'sdxl' in families, families
          assert k.get_guidance('flux')['sampling'], 'guidance YAML did not ship'
          "
